# Supabase CLI local development configuration.
# See https://supabase.com/docs/guides/local-development/cli/config

project_id = "supabase"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Invoice creation is intended for signed-in application users.
[functions.duitku-create-invoice]
verify_jwt = true

# Duitku calls this webhook directly; the function verifies Duitku's HMAC signature.
[functions.duitku-callback]
verify_jwt = false

# External scheduler calls this endpoint with PAYMENT_EXPIRY_SECRET.
[functions.duitku-expire-orders]
verify_jwt = false
